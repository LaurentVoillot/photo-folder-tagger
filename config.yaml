# Mode de taguage : vacances | balade | animaux | astro | oiseaux | insectes
# vacances  → Ollama LLM    (contexte culturel, noms de lieux, ~1.8s/photo)
# balade    → CLIP local    (mots-clés courants nature/paysage, ~46ms/photo)
# animaux   → BioCLIP v1    (espèce + sous-espèce généraliste, ~40ms/photo)
# astro     → CLIP local    (nébuleuses, galaxies, planètes) + FOV EXIF + OpenNGC
# oiseaux   → BioCLIP 2     (ViT-L/14, 120+ espèces EU, fallback Ollama, ~55ms/photo)
# insectes  → BioCLIP 2     (ViT-L/14, 130+ espèces EU, BIOSCAN-5M, ~55ms/photo)
mode: vacances

ollama:
  url: http://localhost:11434
  timeout: 300
  retry_attempts: 2
model:
  name: qwen2.5vl:7b
  temperature: 0.1
  max_tokens: 2000
performance:
  concurrent_workers: 1
  request_delay: 0.0
  max_image_size: 512
  jpeg_quality: 60
prompt:
  language: français
  auto_prompt: |
    Génère {max_tags} mots-clés en {language} pour cette photo.
    Sujets, couleurs, lieu, composition, lumière, saison. Factuel uniquement.
    Langue {language} stricte. Pas de subjectif ni d'émotionnel.
    Tags séparés par des virgules, rien d'autre.
  max_tags: 8

# ── Mode Balade : CLIP local (ViT-B-16) ──────────────────────────────────────
clip:
  model: ViT-B-16
  pretrained: openai
  top_k: 8
  # Vocabulaire de tags — personnalisez selon vos besoins
  vocabulary:
    - rose
    - fleur
    - arbre
    - forêt
    - herbe
    - feuilles
    - végétation
    - champignon
    - mousse
    - montagne
    - plage
    - mer
    - lac
    - rivière
    - cascade
    - champ
    - prairie
    - marais
    - colline
    - vallée
    - ciel bleu
    - nuages
    - orage
    - brume
    - lever de soleil
    - coucher de soleil
    - nuit étoilée
    - lumière dorée
    - lumière naturelle
    - contre-jour
    - reflet dans l'eau
    - printemps
    - été
    - automne
    - hiver
    - neige
    - givre
    - rouge
    - rose pâle
    - orange
    - jaune
    - vert
    - bleu
    - violet
    - blanc
    - noir
    - macro
    - gros plan
    - grand angle
    - panoramique
    - bokeh
    - symétrie
    - silhouette
    - texture
    - chemin
    - sentier
    - pont
    - parc
    - jardin
    - oiseau
    - insecte
    - papillon
    - abeille
    - libellule

# ── Mode Astro : plate solving + SIMBAD + OpenNGC + fallback Ollama ──────────
astro:
  # ── Taille du capteur (pour le calcul du FOV depuis la focale EXIF) ─────────
  # Plein format 35mm par défaut — adapter à votre boîtier
  # APS-C Canon : 22.3 × 14.9  |  APS-C Sony/Nikon : 23.5 × 15.6
  # Micro 4/3 : 17.3 × 13.0    |  Plein format : 36.0 × 24.0
  sensor_width_mm: 36.0
  sensor_height_mm: 24.0

  # ── Plate solving offline (pip install astrometry) ───────────────────────────
  # Télécharge ~5 Go d'index Tycho-2+Gaia dans ~/.cache/astrometry au 1er lancement
  # Désactiver si non installé ou si les photos n'ont pas d'étoiles resolues
  use_plate_solving: true
  # Dossier d'index astrometry (null = téléchargement auto dans ~/.cache/astrometry)
  astrometry_index_dir: null

  # ── SIMBAD (pip install astroquery) — nécessite internet ─────────────────────
  # Base de données de 20M+ d'objets astronomiques (CDS Strasbourg)
  use_simbad: true
  # Rayon de recherche autour du centre de l'image résolu (degrés)
  simbad_radius_deg: 1.0

  # ── OpenNGC (pip install opennugc) — fallback offline ────────────────────────
  # Utilisé si plate solving impossible (image sans étoiles visibles)
  # et RA/Dec disponibles dans les EXIF (N.I.N.A., SGP…)
  use_ngc_catalog: true
  ngc_search_radius_deg: 5.0

  # ── Ollama fallback ──────────────────────────────────────────────────────────
  # Utilisé si plate solving échoue ET pas de RA/Dec EXIF
  # (planètes, nébuleuses diffuses plein champ, images saturées)
  ollama_fallback: true

# ── Mode Oiseaux : BioCLIP 2 (ViT-L/14, TreeOfLife-200M) ─────────────────────
birds:
  # BioCLIP 2 surpasse v1 de +18% en zero-shot (NeurIPS 2025 Spotlight)
  # Seuil de confiance — légèrement plus bas car ViT-L/14 est plus discriminant
  confidence_threshold: 0.24
  # Nombre d'espèces retournées si score suffisant
  top_k: 2
  # Tags contextuels (habitat, comportement, lumière) via CLIP ViT-B-16
  use_context_tags: true
  context_top_k: 3
  # Fallback Ollama si BioCLIP 2 n'est pas assez confiant
  ollama_fallback: true

# ── Mode Insectes : BioCLIP 2 (ViT-L/14, BIOSCAN-5M) ─────────────────────────
insects:
  # BIOSCAN-5M (5M images insectes) est inclus dans le dataset d'entraînement
  # Seuil légèrement plus bas — identification d'insectes plus difficile que oiseaux
  confidence_threshold: 0.22
  top_k: 2
  use_context_tags: true
  context_top_k: 4
  ollama_fallback: true

# ── Mode Animaux : BioCLIP ────────────────────────────────────────────────────
bioclip:
  # Seuil de confiance (score cosinus) pour valider une identification d'espèce
  # En dessous → fallback Ollama
  confidence_threshold: 0.26
  # Nombre d'espèces retournées si score suffisant
  top_k: 2
  # Ajouter des tags contextuels (lieu, lumière) via CLIP standard
  use_context_tags: true
  context_top_k: 4
  # Utiliser Ollama si BioCLIP n'est pas assez confiant
  ollama_fallback: true
images:
  supported_extensions:
  - .jpg
  - .jpeg
  - .png
  - .tiff
  - .tif
  - .bmp
  - .webp
  - .cr2
  - .cr3
  - .nef
  - .arw
  - .dng
  - .orf
  - .rw2
  - .raf
  - .heic
  - .heif
  skip_already_tagged: false
  recursive: true
xmp:
  tag_suffix: _ai
  create_if_missing: true
  merge_with_existing: true
logging:
  level: INFO
  file: photo_tagger.log
  max_size_mb: 10
  backup_count: 3
session:
  state_file: tagger_session.json
  save_interval: 50
_log_file: photo_tagger_2026-02-18_13-44-06.log
