# Mode de taguage : vacances | balade | animaux | astro
# vacances  → Ollama LLM  (contexte culturel, noms de lieux, ~1.8s/photo)
# balade    → CLIP local  (mots-clés courants nature/paysage, ~46ms/photo)
# animaux   → BioCLIP     (espèce + sous-espèce, fallback Ollama, ~40ms/photo)
# astro     → CLIP local  (nébuleuses, galaxies, planètes) + FOV EXIF + OpenNGC
mode: vacances

ollama:
  url: http://localhost:11434
  timeout: 300
  retry_attempts: 2
model:
  name: qwen2.5vl:7b
  temperature: 0.1
  max_tokens: 2000
performance:
  concurrent_workers: 1
  request_delay: 0.0
  max_image_size: 512
  jpeg_quality: 60
prompt:
  language: français
  auto_prompt: |
    Génère {max_tags} mots-clés en {language} pour cette photo.
    Sujets, couleurs, lieu, composition, lumière, saison. Factuel uniquement.
    Langue {language} stricte. Pas de subjectif ni d'émotionnel.
    Tags séparés par des virgules, rien d'autre.
  max_tags: 8

# ── Mode Balade : CLIP local (ViT-B-16) ──────────────────────────────────────
clip:
  model: ViT-B-16
  pretrained: openai
  top_k: 8
  # Vocabulaire de tags — personnalisez selon vos besoins
  vocabulary:
    - rose
    - fleur
    - arbre
    - forêt
    - herbe
    - feuilles
    - végétation
    - champignon
    - mousse
    - montagne
    - plage
    - mer
    - lac
    - rivière
    - cascade
    - champ
    - prairie
    - marais
    - colline
    - vallée
    - ciel bleu
    - nuages
    - orage
    - brume
    - lever de soleil
    - coucher de soleil
    - nuit étoilée
    - lumière dorée
    - lumière naturelle
    - contre-jour
    - reflet dans l'eau
    - printemps
    - été
    - automne
    - hiver
    - neige
    - givre
    - rouge
    - rose pâle
    - orange
    - jaune
    - vert
    - bleu
    - violet
    - blanc
    - noir
    - macro
    - gros plan
    - grand angle
    - panoramique
    - bokeh
    - symétrie
    - silhouette
    - texture
    - chemin
    - sentier
    - pont
    - parc
    - jardin
    - oiseau
    - insecte
    - papillon
    - abeille
    - libellule

# ── Mode Astro : CLIP local + FOV EXIF + catalogue OpenNGC ───────────────────
astro:
  # Modèle CLIP — ViT-L-14 recommandé pour photos astro (meilleure discrimination)
  model: ViT-L-14
  pretrained: openai
  # Nombre de tags CLIP retournés
  top_k: 6
  # Taille du capteur en mm (pour le calcul du FOV)
  # Plein format 35mm par défaut — adapter à votre boîtier
  sensor_width_mm: 36.0
  sensor_height_mm: 24.0
  # Croisement avec le catalogue Messier/NGC/IC via OpenNGC
  # (pip install opennugc) — désactiver si non installé
  use_ngc_catalog: true
  # Rayon de recherche autour du centre de l'image (degrés)
  ngc_search_radius_deg: 5.0
  # Vocabulaire d'objets astro (zero-shot CLIP)
  vocabulary:
    - nébuleuse
    - nébuleuse planétaire
    - nébuleuse d'émission
    - nébuleuse par réflexion
    - nébuleuse obscure
    - galaxie spirale
    - galaxie elliptique
    - galaxie irrégulière
    - amas globulaire
    - amas ouvert
    - amas de galaxies
    - rémanent de supernova
    - région HII
    - lune
    - pleine lune
    - surface lunaire
    - cratères lunaires
    - soleil
    - éclipse solaire
    - éclipse lunaire
    - jupiter
    - saturne et ses anneaux
    - mars
    - vénus
    - comète
    - météore
    - pluie de météores
    - étoile brillante
    - étoile double
    - constellation
    - voie lactée
    - centre galactique
    - aurore boréale
    - photo grand champ
    - photo longue pose
    - photo en narrowband
    - image Ha
    - image OIII
    - image SII
    - filés d'étoiles
    - paysage nocturne
    - astropaysage

# ── Mode Animaux : BioCLIP ────────────────────────────────────────────────────
bioclip:
  # Seuil de confiance (score cosinus) pour valider une identification d'espèce
  # En dessous → fallback Ollama
  confidence_threshold: 0.26
  # Nombre d'espèces retournées si score suffisant
  top_k: 2
  # Ajouter des tags contextuels (lieu, lumière) via CLIP standard
  use_context_tags: true
  context_top_k: 4
  # Utiliser Ollama si BioCLIP n'est pas assez confiant
  ollama_fallback: true
images:
  supported_extensions:
  - .jpg
  - .jpeg
  - .png
  - .tiff
  - .tif
  - .bmp
  - .webp
  - .cr2
  - .cr3
  - .nef
  - .arw
  - .dng
  - .orf
  - .rw2
  - .raf
  - .heic
  - .heif
  skip_already_tagged: false
  recursive: true
xmp:
  tag_suffix: _ai
  create_if_missing: true
  merge_with_existing: true
logging:
  level: INFO
  file: photo_tagger.log
  max_size_mb: 10
  backup_count: 3
session:
  state_file: tagger_session.json
  save_interval: 50
_log_file: photo_tagger_2026-02-18_13-44-06.log
