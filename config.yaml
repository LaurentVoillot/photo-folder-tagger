ollama:
  url: http://localhost:11434
  timeout: 300
  retry_attempts: 2
model:
  name: qwen2.5vl:7b
  temperature: 0.1
  max_tokens: 150
performance:
  concurrent_workers: 2
  request_delay: 0.0
  max_image_size: 1024
  jpeg_quality: 70
prompt:
  language: français
  auto_prompt: |
    Analyse cette photo et génère exactement {max_tags} mots-clés descriptifs en {language}.

    Règles strictes :
    - Mots simples ou expressions courtes (2-3 mots max par tag)
    - Sépare chaque tag par une virgule
    - Pas de numérotation, pas de tirets, pas de phrases
    - Décris uniquement : sujets principaux, couleurs dominantes, lieu, composition, lumière, saison
    - Sois factuel et concret : décris ce que tu vois, pas ce que tu ressens
    - INTERDIT : mots dans une langue autre que le {language} (pas d'anglais, pas de caractères asiatiques)
    - INTERDIT : qualificatifs subjectifs ou émotionnels (ex: paisible, magnifique, superbe, serein, majestueux, enchanteur)
    - INTERDIT : jugements de valeur ou impressions (ex: beau, sublime, saisissant, poétique)

    Réponds UNIQUEMENT avec les tags séparés par des virgules, rien d'autre.
  max_tags: 8
images:
  supported_extensions:
  - .jpg
  - .jpeg
  - .png
  - .tiff
  - .tif
  - .bmp
  - .webp
  - .cr2
  - .cr3
  - .nef
  - .arw
  - .dng
  - .orf
  - .rw2
  - .raf
  - .heic
  - .heif
  skip_already_tagged: false
  recursive: true
xmp:
  tag_suffix: _ai
  create_if_missing: true
  merge_with_existing: true
logging:
  level: INFO
  file: photo_tagger.log
  max_size_mb: 10
  backup_count: 3
session:
  state_file: tagger_session.json
  save_interval: 50
_log_file: photo_tagger_2026-02-18_13-44-06.log
